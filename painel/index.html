    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(SALT),iterations:200000,hash:'SHA-256'},kb,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(IV)},key,b64d(CT));
    document.open();document.write(new TextDecoder().decode(pt));document.close();
  }catch(e){document.getElementById('err').style.display='block';}
}
function b64d(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
