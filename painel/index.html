const ITER=200000;
function b2b(b64){const s=atob(b64),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
async function deriveKey(pw,salt){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function tryOpen(pw){
  try{
    const key=await deriveKey(pw,b2b(SALT));
    const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2b(IV)},key,b2b(CT));
    return new TextDecoder().decode(plain);
  }catch{return null;}
}

  // Show token field if no token saved yet
  if(!localStorage.getItem('gm_gh_token')){
    document.getElementById('tok-wrap').style.display='block';
  }
})();
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();
  const rem=lockUntil()-Date.now();
  if(rem>0){errEl.textContent=`Bloqueado. Tente em ${Math.ceil(rem/60000)} min.`;return;}
  btn.style.display='none';spin.style.display='block';errEl.textContent='';
  const pw=document.getElementById('pw').value;
  const html=await tryOpen(pw);
  spin.style.display='none';btn.style.display='block';
  if(html){
    localStorage.removeItem('gm_lock_until');localStorage.removeItem('gm_att');
    const tokEl=document.getElementById('tok');
    if(tokEl&&tokEl.value.trim()){localStorage.setItem('gm_gh_token',tokEl.value.trim());}
    document.open();document.write(html);document.close();
  }else{
    const att=attempts()+1;
    localStorage.setItem('gm_att',att);
    if(att>=3){
      localStorage.setItem('gm_lock_until',Date.now()+5*60*1000);
      localStorage.removeItem('gm_att');
      errEl.textContent='3 tentativas incorretas — bloqueado por 5 minutos.';
      btn.disabled=true;
    }else{
      errEl.textContent=`Senha incorreta. ${3-att} tentativa(s) restante(s).`;
    }
  }
});
</script>
</body>
</html>
