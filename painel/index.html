    const ct2=Uint8Array.from(atob(CT),c=>c.charCodeAt(0));
    const iv2=Uint8Array.from(atob(IV),c=>c.charCodeAt(0));
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv2},k,ct2);
    const html=new TextDecoder().decode(plain);
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('err').style.display='block';}
}
</script></body></html>
