async function unlock(){
  const pw=document.getElementById('pw').value;
  if(!pw)return;
  try{
    const salt=b64d(SALT),iv=b64d(IV),ct=b64d(CT);
    const k=await crypto.subtle.importKey('raw',
      await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},
        await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']),256),
      {name:'AES-GCM'},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},k,ct);
    document.open();document.write(new TextDecoder().decode(pt));document.close();
  }catch(e){
    document.getElementById('err').style.display='block';
    document.getElementById('pw').value='';
    document.getElementById('pw').focus();
  }
}
function b64d(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
